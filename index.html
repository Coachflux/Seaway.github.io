<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thirdweb Contract Connection</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px;">
  <h2>Thirdweb Contract Example</h2>
  <button id="connectWallet">Connect Wallet</button>
  <p id="status">Not connected</p>

  <!-- Load Thirdweb SDK (browser ESM build) -->
  <script type="module">
    import {
      createThirdwebClient,
      getContract,
      resolveMethod,
    } from "https://cdn.jsdelivr.net/npm/thirdweb@5/dist/esm/index.js";

    import { defineChain } from "https://cdn.jsdelivr.net/npm/thirdweb@5/dist/esm/chains/index.js";

    // Create client
    const client = createThirdwebClient({
      clientId: "e3ca99c9ac33ab73630fe70e24143a8d", // replace with your actual Client ID from thirdweb dashboard
    });

    // Connect to your contract (BNB chain = 56)
    const contract = getContract({
      client,
      chain: defineChain(56),
      address: "0x65282B3EE25f216fa509669eC6C853eFf4863729",
    });

    const statusEl = document.getElementById("status");
    const connectBtn = document.getElementById("connectWallet");

    connectBtn.addEventListener("click", async () => {
      try {
        // Request wallet connection (via MetaMask or injected provider)
        if (window.ethereum) {
          await window.ethereum.request({ method: "eth_requestAccounts" });
          const accounts = await window.ethereum.request({ method: "eth_accounts" });

          statusEl.textContent = `Connected: ${accounts[0]}`;

          // Example: Call a read-only function (replace with your actual function name)
          try {
            const balance = await contract.read("balanceOf", [accounts[0]]);
            statusEl.textContent += ` | Balance: ${balance}`;
          } catch (err) {
            console.log("Contract call failed:", err);
          }
        } else {
          alert("MetaMask not detected. Please install it.");
        }
      } catch (err) {
        console.error(err);
        statusEl.textContent = "Connection failed";
      }
    });
  </script>
</body>
</html>
